[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tabkit"
version = "0.1.0"
description = "TabKit — native guitar tablature editor and sequencer (Python port of the web app)"
requires-python = ">=3.10"
dependencies = [
    "pyFluidSynth>=1.3",
    "python-rtmidi>=1.5",
    "mido>=1.3",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]

[project.scripts]
tabkit = "tabkit.cli:main"

[tool.setuptools.packages.find]
include = ["tabkit*"]
